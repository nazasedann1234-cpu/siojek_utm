<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIOJEK UTM - Masuk / Daftar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="bg-gray-100 text-gray-800 font-sans min-h-screen flex flex-col justify-between">
    <nav class="bg-blue-900 text-white shadow-md sticky top-0 z-40">
      <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
        <div class="flex items-center space-x-2">
          <i class="fa-solid fa-motorcycle text-yellow-400 text-2xl"></i>
          <span class="text-xl font-bold tracking-wide">SIOJEK <span class="text-yellow-400">UTM</span></span>
        </div>
      </div>
    </nav>

    <div id="authSection" class="flex-grow flex items-center justify-center px-4 py-8">
      <div id="loginCard" class="bg-white p-8 rounded-2xl shadow-md border border-gray-200 w-full max-w-md">
        <div class="text-center mb-6">
          <i class="fa-solid fa-circle-user text-blue-900 text-5xl mb-2"></i>
          <h1 class="text-2xl font-bold text-blue-900">Masuk ke SIOJEK UTM</h1>
          <p class="text-xs text-gray-500 mt-1">Silakan masuk dengan akun Anda</p>
        </div>

        <form onsubmit="handleLogin(event)" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">NIM / Username</label>
            <input type="text" id="loginUser" required class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm" placeholder="Email atau username" />
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Password</label>
            <div class="relative">
              <input type="password" id="loginPass" required class="w-full p-2.5 pr-10 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm" placeholder="••••••••" />
              <button type="button" onclick="togglePasswordVisibility('loginPass', 'toggleIconLogin')" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600">
                <i id="toggleIconLogin" class="fa-solid fa-eye"></i>
              </button>
            </div>
          </div>
          <button type="submit" class="w-full bg-blue-900 text-white py-2.5 rounded-lg font-bold text-sm hover:bg-blue-800 transition">Masuk Sekarang</button>
        </form>

        <div class="mt-4 text-center">
          <p class="text-xs text-gray-600">
            Belum punya akun?
            <button onclick="toggleAuthMode('register')" class="text-blue-700 font-bold hover:underline">Daftar Akun Baru</button>
          </p>
        </div>

      </div>

      <div id="registerCard" class="bg-white p-8 rounded-2xl shadow-md border border-gray-200 w-full max-w-md hidden">
        <div class="text-center mb-6">
          <i class="fa-solid fa-user-plus text-blue-900 text-4xl mb-2"></i>
          <h1 class="text-2xl font-bold text-blue-900">Buat Akun Baru</h1>
          <p class="text-xs text-gray-500 mt-1">Daftar sebagai Penumpang atau Pengemudi</p>
        </div>

        <form onsubmit="handleRegister(event)" class="space-y-3">
          <div>
            <label for="regRole" class="block text-xs font-semibold uppercase text-gray-600 mb-1">Daftar Sebagai</label>
            <select id="regRole" required class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm">
              <option value="penumpang">Penumpang (Mahasiswa)</option>
              <option value="pengemudi">Pengemudi (Driver)</option>
            </select>
          </div>
          <div>
            <label for="regName" class="block text-xs font-semibold uppercase text-gray-600 mb-1">Nama Lengkap</label>
            <input type="text" id="regName" required minlength="2" maxlength="100"
              autocomplete="name"
              class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm"
              placeholder="Contoh: Ahmad Subagja" />
          </div>
          <div>
            <label for="regUser" class="block text-xs font-semibold uppercase text-gray-600 mb-1">Email (Username)</label>
            <input type="email" id="regUser" required maxlength="254"
              autocomplete="email"
              class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm"
              placeholder="nama@email.com" />
          </div>
          <div>
            <label for="regWA" class="block text-xs font-semibold uppercase text-gray-600 mb-1">No. WhatsApp</label>
            <input type="tel" id="regWA" required maxlength="16"
              pattern="(08|628|\+628)[1-9][0-9]{6,10}"
              title="Gunakan format 08xxxxxxxxxx atau +628xxxxxxxxxx"
              inputmode="tel" autocomplete="tel"
              class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm"
              placeholder="08xxxxxxxxxx" />
          </div>
          <div>
            <label for="regPass" class="block text-xs font-semibold uppercase text-gray-600 mb-1">Password</label>
            <div class="relative">
              <input type="password" id="regPass" required minlength="8" maxlength="72"
                autocomplete="new-password"
                class="w-full p-2.5 pr-10 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm"
                placeholder="Minimal 8 karakter" />
              <button type="button" onclick="togglePasswordVisibility('regPass', 'toggleIconReg')" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600">
                <i id="toggleIconReg" class="fa-solid fa-eye"></i>
              </button>
            </div>
          </div>
          <button type="submit" class="w-full bg-green-600 text-white py-2.5 rounded-lg font-bold text-sm hover:bg-green-700 transition mt-2">Daftar Sekarang</button>
        </form>

        <div class="mt-4 text-center">
          <p class="text-xs text-gray-600">
            Sudah punya akun?
            <button onclick="toggleAuthMode('login')" class="text-blue-700 font-bold hover:underline">Kembali ke Login</button>
          </p>
        </div>
      </div>
    </div>

    <footer class="bg-blue-950 text-white text-center py-4 border-t border-blue-900 text-xs">
      <p>&copy; 2026 SIOJEK UTM - Sistem Informasi Ojek Mahasiswa Universitas Trunojoyo Madura.</p>
    </footer>

    <!-- Urutan pemanggilan penting: config -> utils -> session -> login -->
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/session.js"></script>
    <script src="js/login.js"></script>
  </body>
</html>
